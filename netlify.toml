# Frontend-only deploy (the API must run elsewhere – see DEPLOY.md, option D).
# Set VITE_API_URL=https://<your-api-host> in Site settings → Environment variables.
[build]
  command = "npm run build -w client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
