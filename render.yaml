# Render Blueprint – one web service that runs the API and serves the built client.
# Dashboard → New + → Blueprint → pick this repo/branch → Apply.
services:
  - type: web
    name: qareeb
    runtime: node
    plan: free                  # free instances sleep after 15 min idle and have NO persistent disk
    region: singapore           # closest region to Pakistan
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_SEED           # seed Abbottabad demo shops/users on first boot (set false for a real launch)
        value: "true"
      - key: DEMO_PASSWORD
        value: password123
      # ── Persistence (needs a paid instance: uncomment the disk + both env vars) ──
